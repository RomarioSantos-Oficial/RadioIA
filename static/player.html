<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark"><title>Playout OBS</title>
  <style>
    *{box-sizing:border-box;cursor:none}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}body{font-family:system-ui,sans-serif;color:#fff}
    #stage{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
    #backdrop{position:absolute;inset:0;background:#000 center/contain no-repeat;z-index:0}
    #media{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:transparent;z-index:1}
    #media.audio{opacity:0;pointer-events:none}
    #tickerBar{--ticker-bg:#111827;--ticker-text:#fff;--ticker-accent:#34d399;--ticker-height:72px;--ticker-font-size:24px;--ticker-opacity:92%;--ticker-speed:32s;position:absolute;z-index:2;left:0;right:0;display:none;align-items:center;overflow:hidden;color:var(--ticker-text);background:color-mix(in srgb,var(--ticker-bg) var(--ticker-opacity),transparent);height:var(--ticker-height);font-size:var(--ticker-font-size);font-weight:650;font-family:Arial,system-ui,sans-serif}
    #tickerBar.top{top:0}#tickerBar.bottom{bottom:0}#tickerLabel{z-index:2;height:100%;width:210px;flex:0 0 210px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:3px 8px;background:var(--ticker-accent);color:#06130f;white-space:nowrap;font-size:.72em;letter-spacing:.04em;text-transform:uppercase}#tickerLabelText{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;max-width:100%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#tickerLabelText.clock{font-size:1.28em;letter-spacing:.06em}#tickerLabelText.weather{line-height:1.05;letter-spacing:.01em}.tickerWeatherLocation{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.62em;font-weight:600}.tickerWeatherTemperature{display:block;font-size:1.16em;font-weight:750;line-height:1.05}.tickerLabelEnter{animation:tickerLabelUp .35s ease-out}@keyframes tickerLabelUp{from{transform:translateY(100%);opacity:.2}to{transform:translateY(0);opacity:1}}
    #tickerViewport{overflow:hidden;flex:1;min-width:0}.tickerTrack{display:flex;width:max-content;align-items:center;animation:tickerCrawl var(--ticker-speed) linear infinite}.tickerGroup{display:flex;align-items:center;flex:none;white-space:nowrap}.tickerItem{display:inline-flex;align-items:center;gap:12px;padding:0 26px;color:var(--item-color,var(--ticker-text))}.tickerImage{width:72px;height:calc(var(--ticker-height)*.72);flex:none;object-fit:cover;border-radius:4px}.tickerSeparator{color:var(--ticker-accent);padding:0 16px}
    @keyframes tickerCrawl{from{transform:translateX(0)}to{transform:translateX(-50%)}}
    #notice{position:absolute;z-index:3;left:18px;bottom:16px;max-width:calc(100vw - 36px);padding:7px 10px;border-radius:7px;background:#111b;color:#b6c5d6;font:12px/1.4 system-ui,sans-serif;opacity:0;transition:opacity .3s;pointer-events:none}
    #notice.show{opacity:1}#activate{position:absolute;z-index:5;inset:0;display:none;align-items:center;justify-content:center;background:#0009;color:#fff;text-align:center;font:16px system-ui,sans-serif}
    #activate.visible{display:flex}#activate button{border:1px solid #53c899;background:#147453;color:white;border-radius:10px;padding:13px 18px;font:600 15px system-ui,sans-serif;cursor:pointer}
  </style>
</head>
<body>
  <main id="stage"><div id="backdrop"></div><video id="media" playsinline autoplay></video>
    <aside id="tickerBar" aria-label="Faixa de informações"><div id="tickerLabel"><span id="tickerLabelText"></span></div><div id="tickerViewport"><div id="tickerTrack" class="tickerTrack"><div id="tickerGroupA" class="tickerGroup"></div><div id="tickerGroupB" class="tickerGroup" aria-hidden="true"></div></div></div></aside>
    <div id="notice">Conectando ao motor de playout…</div>
    <div id="activate"><button id="activateButton">Clique para iniciar o áudio</button></div>
  </main>
<script>
const video=document.getElementById('media'),backdrop=document.getElementById('backdrop'),notice=document.getElementById('notice'),activate=document.getElementById('activate');
const tickerBar=document.getElementById('tickerBar'),tickerLabel=document.getElementById('tickerLabel'),tickerLabelText=document.getElementById('tickerLabelText'),tickerViewport=document.getElementById('tickerViewport'),tickerTrack=document.getElementById('tickerTrack'),tickerGroupA=document.getElementById('tickerGroupA'),tickerGroupB=document.getElementById('tickerGroupB');
let ws=null,lastToken=-1,activeState='stopped',wantPosition=0,allowPlayback=false,retryTimer=null,noticeTimer=null,lastPlaybackPosition=0,lastPlaybackAdvance=Date.now(),errorSentToken=-1,lastTickerSignature=null,lastTickerData=null,labelCards=[],labelCardIndex=-1,labelTimer=null,labelCardsSignature='';
function showNotice(message,temporary=false){notice.textContent=message;notice.classList.add('show');if(temporary){clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>notice.classList.remove('show'),2600)}}
function tickerLoopItems(){return [...(lastTickerData.items||[]),...(lastTickerData.weather||[])]}
function appendTickerItems(group,items,c){for(const item of items){const span=document.createElement('span');span.className='tickerItem';if(item.color)span.style.setProperty('--item-color',item.color);if(item.image_url){const image=document.createElement('img');image.className='tickerImage';image.src=item.image_url;image.alt='';span.append(image)}if(item.clock){span.append(document.createTextNode('Hora '));const value=document.createElement('time');value.className='tickerClockValue';span.append(value)}else span.append(document.createTextNode(item.text));const separator=document.createElement('b');separator.className='tickerSeparator';separator.textContent=c.separator||'◆';span.append(separator);group.append(span)}}
function fillTickerLoop(){if(!lastTickerData)return;const items=tickerLoopItems();if(!items.length)return;tickerGroupA.replaceChildren();appendTickerItems(tickerGroupA,items,lastTickerData.config||{});const initialWidth=tickerGroupA.scrollWidth;if(!initialWidth)return;const repeats=Math.max(0,Math.ceil(tickerViewport.clientWidth/initialWidth)-1);for(let i=0;i<repeats;i++)appendTickerItems(tickerGroupA,items,lastTickerData.config||{});tickerGroupB.replaceChildren(...[...tickerGroupA.children].map(child=>child.cloneNode(true)));const seconds=(lastTickerData.config?.speed_seconds||90)*tickerGroupA.scrollWidth/Math.max(1,tickerViewport.clientWidth);tickerTrack.style.animationDuration=`${seconds}s`}
function tickerBrasiliaTime(){return new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',hour:'2-digit',minute:'2-digit'}).format(new Date())}
function showTickerLabel(card){tickerLabelText.replaceChildren();tickerLabelText.className=card.type==='weather'?'weather':card.type==='clock'?'clock':'';if(card.type==='weather'){const location=document.createElement('span');location.className='tickerWeatherLocation';location.textContent=card.location||card.text;const temperature=document.createElement('span');temperature.className='tickerWeatherTemperature';temperature.textContent=card.temperature||'';tickerLabelText.append(location,temperature)}else tickerLabelText.textContent=card.type==='clock'?tickerBrasiliaTime():card.text;tickerLabelText.classList.remove('tickerLabelEnter');void tickerLabelText.offsetWidth;tickerLabelText.classList.add('tickerLabelEnter')}
function updateTickerLabelCards(data){const c=data.config||{},weather=data.weather||[],signature=JSON.stringify([c.prefix,c.show_clock,c.rotation_seconds,weather.map(item=>item.id)]);if(signature===labelCardsSignature){for(const item of weather){const card=labelCards.find(candidate=>candidate.id===item.id);if(card){const location=item.location||item.text,temperature=item.temperature||'';if(card.text!==item.text||card.location!==location||card.temperature!==temperature){card.text=item.text;card.location=location;card.temperature=temperature;if(labelCards[labelCardIndex]===card)showTickerLabel(card)}}}return}labelCardsSignature=signature;labelCards=[{type:'text',id:'news',text:c.prefix||'NOTÍCIAS'}];if(c.show_clock)labelCards.push({type:'clock',id:'clock'});for(const item of weather)labelCards.push({type:'weather',id:item.id,text:item.text,location:item.location||item.text,temperature:item.temperature||''});labelCardIndex=0;showTickerLabel(labelCards[0]);clearInterval(labelTimer);if(labelCards.length>1)labelTimer=setInterval(()=>{labelCardIndex=(labelCardIndex+1)%labelCards.length;showTickerLabel(labelCards[labelCardIndex])},(c.rotation_seconds||10)*1000)}
function renderTicker(data){const signature=JSON.stringify(data);lastTickerData=data;const c=data.config||{},items=[...(data.items||[]),...(data.weather||[])],visible=!!(c.enabled&&data.show&&(items.length||c.show_clock));if(signature!==lastTickerSignature){lastTickerSignature=signature;for(const [property,value] of [['--ticker-bg',c.background_color||'#111827'],['--ticker-text',c.text_color||'#ffffff'],['--ticker-accent',c.accent_color||'#34d399'],['--ticker-height',`${c.height||72}px`],['--ticker-font-size',`${c.font_size||24}px`],['--ticker-opacity',`${c.opacity||92}%`],['--ticker-speed',`${c.speed_seconds||90}s`]])tickerBar.style.setProperty(property,value);tickerBar.className=c.position==='top'?'top':'bottom';tickerBar.style.display=visible?'flex':'none';if(visible)fillTickerLoop();else{tickerGroupA.replaceChildren();tickerGroupB.replaceChildren()}}if(visible)updateTickerLabelCards(data)}
async function updateTicker(){try{const response=await fetch('/api/ticker/state',{cache:'no-store'});if(response.ok)renderTicker(await response.json())}catch{tickerBar.style.display='none'}}
function send(payload){if(ws?.readyState===WebSocket.OPEN)ws.send(JSON.stringify(payload))}
function setBackground(url){backdrop.style.backgroundImage=url?`url("${url}")`:''}
function setAudioVisual(current){const audio=current?.kind==='audio';video.classList.toggle('audio',audio);backdrop.style.display=audio?'block':'none'}
async function attemptPlay(){if(!video.src)return;try{await video.play();allowPlayback=true;activate.classList.remove('visible')}catch(e){if(e?.name==='NotAllowedError'||e?.name==='NotSupportedError'){activate.classList.add('visible')}else showNotice('Não foi possível iniciar a mídia. Confira o arquivo.')}}
function applyState(s){
  if(s.background_url)setBackground(s.background_url);else setBackground('');
  activeState=s.state||'stopped';
  if(!s.current){if(video.src){video.pause();video.removeAttribute('src');video.load()}lastToken=s.token??lastToken;activate.classList.remove('visible');if(s.message)showNotice(s.message,true);return}
  setAudioVisual(s.current);
  if(s.token!==lastToken){lastToken=s.token;errorSentToken=-1;lastPlaybackPosition=0;lastPlaybackAdvance=Date.now();wantPosition=Number(s.position||0);video.pause();video.src=`/media/${s.current.id}?play=${s.token}`;video.load();video.onloadedmetadata=async()=>{if(wantPosition>0&&Number.isFinite(video.duration))try{video.currentTime=Math.min(wantPosition,Math.max(0,video.duration-.25))}catch{}if(activeState==='playing')await attemptPlay()};video.onerror=()=>reportPlayerError('Arquivo indisponível ou formato não suportado. Confira no painel.')}
  if(activeState==='paused'){video.pause();activate.classList.remove('visible')}
  else if(activeState==='playing'&&video.paused&&!video.ended&&video.readyState>=2)attemptPlay();
  if(s.message&&s.state!=='playing')showNotice(s.message,true);
}
function connect(){clearTimeout(retryTimer);const proto=location.protocol==='https:'?'wss':'ws';ws=new WebSocket(`${proto}://${location.host}/ws`);ws.onopen=()=>{notice.classList.remove('show');if(video.ended&&activeState==='playing')send({type:'ended',token:lastToken})};ws.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==='state')applyState(m);else if(m.type==='command'){if(m.command==='pause')video.pause();if(m.command==='resume')attemptPlay()}}catch{}};ws.onclose=()=>{showNotice('Reconectando ao motor…');retryTimer=setTimeout(connect,1200)};ws.onerror=()=>ws.close()}
function reportPlayerError(message){if(lastToken<0||errorSentToken===lastToken)return;errorSentToken=lastToken;send({type:'player-error',token:lastToken});showNotice(message,true)}
document.getElementById('activateButton').addEventListener('click',async()=>{allowPlayback=true;try{await video.play();activate.classList.remove('visible')}catch{showNotice('O navegador não conseguiu reproduzir este arquivo.')}});
video.addEventListener('ended',()=>send({type:'ended',token:lastToken}));
video.addEventListener('playing',()=>{activeState='playing';activate.classList.remove('visible')});
video.addEventListener('error',()=>{if(video.currentSrc)reportPlayerError('Erro ao carregar o arquivo; pulando para o próximo.')});
setInterval(()=>{if(video.src&&!video.ended){const position=video.currentTime||0;if(Math.abs(position-lastPlaybackPosition)>.25){lastPlaybackPosition=position;lastPlaybackAdvance=Date.now()}send({type:'progress',token:lastToken,position});if(activeState==='playing'&&!video.paused&&video.readyState>=2&&!video.seeking&&Date.now()-lastPlaybackAdvance>15000)reportPlayerError('A mídia parou de avançar; pulando para o próximo arquivo.')}},1000);
updateTicker();setInterval(updateTicker,4000);
window.addEventListener('resize',()=>{if(lastTickerData)fillTickerLoop()});
setInterval(()=>{if(labelCards[labelCardIndex]?.type==='clock')tickerLabelText.textContent=tickerBrasiliaTime()},1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&activeState==='playing'&&video.paused&&!video.ended)attemptPlay()});
connect();
</script>
</body>
</html>
