<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark"><title>Playout OBS</title>
  <style>
    *{box-sizing:border-box;cursor:none}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}body{font-family:system-ui,sans-serif;color:#fff}
    #stage{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
    #backdrop{position:absolute;inset:0;background:#000 center/contain no-repeat;z-index:0}
    #media{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:transparent;z-index:1}
    #media.audio{opacity:0;pointer-events:none}
    #notice{position:absolute;z-index:3;left:18px;bottom:16px;max-width:calc(100vw - 36px);padding:7px 10px;border-radius:7px;background:#111b;color:#b6c5d6;font:12px/1.4 system-ui,sans-serif;opacity:0;transition:opacity .3s;pointer-events:none}
    #notice.show{opacity:1}#activate{position:absolute;z-index:5;inset:0;display:none;align-items:center;justify-content:center;background:#0009;color:#fff;text-align:center;font:16px system-ui,sans-serif}
    #activate.visible{display:flex}#activate button{border:1px solid #53c899;background:#147453;color:white;border-radius:10px;padding:13px 18px;font:600 15px system-ui,sans-serif;cursor:pointer}
  </style>
</head>
<body>
  <main id="stage"><div id="backdrop"></div><video id="media" playsinline autoplay></video>
    <div id="notice">Conectando ao motor de playout…</div>
    <div id="activate"><button id="activateButton">Clique para iniciar o áudio</button></div>
  </main>
<script>
const video=document.getElementById('media'),backdrop=document.getElementById('backdrop'),notice=document.getElementById('notice'),activate=document.getElementById('activate');
let ws=null,lastToken=-1,activeState='stopped',wantPosition=0,allowPlayback=false,retryTimer=null,noticeTimer=null,lastPlaybackPosition=0,lastPlaybackAdvance=Date.now(),errorSentToken=-1;
function showNotice(message,temporary=false){notice.textContent=message;notice.classList.add('show');if(temporary){clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>notice.classList.remove('show'),2600)}}
function send(payload){if(ws?.readyState===WebSocket.OPEN)ws.send(JSON.stringify(payload))}
function setBackground(url){backdrop.style.backgroundImage=url?`url("${url}")`:''}
function setAudioVisual(current){const audio=current?.kind==='audio';video.classList.toggle('audio',audio);backdrop.style.display=audio?'block':'none'}
async function attemptPlay(){if(!video.src)return;try{await video.play();allowPlayback=true;activate.classList.remove('visible')}catch(e){if(e?.name==='NotAllowedError'||e?.name==='NotSupportedError'){activate.classList.add('visible')}else showNotice('Não foi possível iniciar a mídia. Confira o arquivo.')}}
function applyState(s){
  if(s.background_url)setBackground(s.background_url);else setBackground('');
  activeState=s.state||'stopped';
  if(!s.current){if(video.src){video.pause();video.removeAttribute('src');video.load()}lastToken=s.token??lastToken;activate.classList.remove('visible');if(s.message)showNotice(s.message,true);return}
  setAudioVisual(s.current);
  if(s.token!==lastToken){lastToken=s.token;errorSentToken=-1;lastPlaybackPosition=0;lastPlaybackAdvance=Date.now();wantPosition=Number(s.position||0);video.pause();video.src=`/media/${s.current.id}?play=${s.token}`;video.load();video.onloadedmetadata=async()=>{if(wantPosition>0&&Number.isFinite(video.duration))try{video.currentTime=Math.min(wantPosition,Math.max(0,video.duration-.25))}catch{}if(activeState==='playing')await attemptPlay()};video.onerror=()=>reportPlayerError('Arquivo indisponível ou formato não suportado. Confira no painel.')}
  if(activeState==='paused'){video.pause();activate.classList.remove('visible')}
  else if(activeState==='playing'&&video.paused&&!video.ended&&video.readyState>=2)attemptPlay();
  if(s.message&&s.state!=='playing')showNotice(s.message,true);
}
function connect(){clearTimeout(retryTimer);const proto=location.protocol==='https:'?'wss':'ws';ws=new WebSocket(`${proto}://${location.host}/ws`);ws.onopen=()=>{notice.classList.remove('show');if(video.ended&&activeState==='playing')send({type:'ended',token:lastToken})};ws.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==='state')applyState(m);else if(m.type==='command'){if(m.command==='pause')video.pause();if(m.command==='resume')attemptPlay()}}catch{}};ws.onclose=()=>{showNotice('Reconectando ao motor…');retryTimer=setTimeout(connect,1200)};ws.onerror=()=>ws.close()}
function reportPlayerError(message){if(lastToken<0||errorSentToken===lastToken)return;errorSentToken=lastToken;send({type:'player-error',token:lastToken});showNotice(message,true)}
document.getElementById('activateButton').addEventListener('click',async()=>{allowPlayback=true;try{await video.play();activate.classList.remove('visible')}catch{showNotice('O navegador não conseguiu reproduzir este arquivo.')}});
video.addEventListener('ended',()=>send({type:'ended',token:lastToken}));
video.addEventListener('playing',()=>{activeState='playing';activate.classList.remove('visible')});
video.addEventListener('error',()=>{if(video.currentSrc)reportPlayerError('Erro ao carregar o arquivo; pulando para o próximo.')});
setInterval(()=>{if(video.src&&!video.ended){const position=video.currentTime||0;if(Math.abs(position-lastPlaybackPosition)>.25){lastPlaybackPosition=position;lastPlaybackAdvance=Date.now()}send({type:'progress',token:lastToken,position});if(activeState==='playing'&&!video.paused&&video.readyState>=2&&!video.seeking&&Date.now()-lastPlaybackAdvance>15000)reportPlayerError('A mídia parou de avançar; pulando para o próximo arquivo.')}},1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&activeState==='playing'&&video.paused&&!video.ended)attemptPlay()});
connect();
</script>
</body>
</html>
