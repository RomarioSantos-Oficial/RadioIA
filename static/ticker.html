<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Faixa de noticias</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;font-family:Arial,system-ui,sans-serif}
    #bar{position:fixed;left:0;right:0;display:none;align-items:center;overflow:hidden;color:var(--text);background:color-mix(in srgb,var(--bg) var(--opacity),transparent);height:var(--height);font-size:var(--font-size);font-weight:650}
    #bar.top{top:0}#bar.bottom{bottom:0}#label{z-index:2;height:100%;width:210px;flex:0 0 210px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0 14px;background:var(--accent);color:#06130f;white-space:nowrap;font-size:.72em;letter-spacing:.04em;text-transform:uppercase}#labelText{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.labelEnter{animation:labelUp .35s ease-out}@keyframes labelUp{from{transform:translateY(100%);opacity:.2}to{transform:translateY(0);opacity:1}}
    #viewport{overflow:hidden;flex:1;min-width:0}.track{display:flex;width:max-content;align-items:center;animation:crawl var(--speed) linear infinite}.group{display:flex;align-items:center;flex:none;white-space:nowrap}.item{display:inline-flex;align-items:center;gap:12px;padding:0 26px;color:var(--item-color,var(--text))}.tickerImage{width:72px;height:calc(var(--height)*.72);flex:none;object-fit:cover;border-radius:4px}.separator{color:var(--accent);padding:0 16px}
    @keyframes crawl{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  </style>
</head>
<body>
  <aside id="bar" aria-label="Faixa de informacoes"><div id="label"><span id="labelText"></span></div><div id="viewport"><div id="track" class="track"><div id="groupA" class="group"></div><div id="groupB" class="group" aria-hidden="true"></div></div></div></aside>
<script>
const bar=document.getElementById('bar'),labelText=document.getElementById('labelText'),viewport=document.getElementById('viewport'),track=document.getElementById('track'),groupA=document.getElementById('groupA'),groupB=document.getElementById('groupB');
let lastSignature=null,lastData=null,labelCards=[],labelCardIndex=-1,labelTimer=null,labelCardsSignature='';
function appendItems(group,items,c){for(const item of items){const span=document.createElement('span');span.className='item';if(item.color)span.style.setProperty('--item-color',item.color);if(item.image_url){const image=document.createElement('img');image.className='tickerImage';image.src=item.image_url;image.alt='';span.append(image)}span.append(document.createTextNode(item.text));const separator=document.createElement('b');separator.className='separator';separator.textContent=c.separator||'◆';span.append(separator);group.append(span)}}
function fillLoop(){if(!lastData)return;const items=[...(lastData.items||[]),...(lastData.weather||[])];if(!items.length)return;groupA.replaceChildren();appendItems(groupA,items,lastData.config||{});const initialWidth=groupA.scrollWidth;if(!initialWidth)return;const repeats=Math.max(0,Math.ceil(viewport.clientWidth/initialWidth)-1);for(let i=0;i<repeats;i++)appendItems(groupA,items,lastData.config||{});groupB.replaceChildren(...[...groupA.children].map(child=>child.cloneNode(true)));track.style.animationDuration=`${(lastData.config?.speed_seconds||90)*groupA.scrollWidth/Math.max(1,viewport.clientWidth)}s`}
function tickerBrasiliaTime(){return new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',hour:'2-digit',minute:'2-digit'}).format(new Date())}
function showLabelCard(card){const value=card.type==='clock'?tickerBrasiliaTime():card.text;labelText.textContent=value;labelText.classList.remove('labelEnter');void labelText.offsetWidth;labelText.classList.add('labelEnter')}
function updateLabelCards(data){const c=data.config||{},weather=data.weather||[],signature=JSON.stringify([c.prefix,c.show_clock,c.rotation_seconds,weather.map(item=>item.id+item.text)]);if(signature===labelCardsSignature)return;labelCardsSignature=signature;labelCards=[{type:'text',text:c.prefix||'NOTÍCIAS'}];if(c.show_clock)labelCards.push({type:'clock'});for(const item of weather)labelCards.push({type:'text',text:item.text});labelCardIndex=0;showLabelCard(labelCards[0]);clearInterval(labelTimer);if(labelCards.length>1)labelTimer=setInterval(()=>{labelCardIndex=(labelCardIndex+1)%labelCards.length;showLabelCard(labelCards[labelCardIndex])},(c.rotation_seconds||10)*1000)}
function render(data){const signature=JSON.stringify(data);lastData=data;const c=data.config||{},items=data.items||[],visible=!!(c.enabled&&data.show&&(items.length||data.weather?.length||c.show_clock));if(signature!==lastSignature){lastSignature=signature;document.documentElement.style.setProperty('--bg',c.background_color||'#111827');document.documentElement.style.setProperty('--text',c.text_color||'#ffffff');document.documentElement.style.setProperty('--accent',c.accent_color||'#34d399');document.documentElement.style.setProperty('--height',`${c.height||72}px`);document.documentElement.style.setProperty('--font-size',`${c.font_size||24}px`);document.documentElement.style.setProperty('--opacity',`${c.opacity||92}%`);document.documentElement.style.setProperty('--speed',`${c.speed_seconds||32}s`);bar.className=c.position==='top'?'top':'bottom';bar.style.display=visible?'flex':'none';if(visible)fillLoop();else{groupA.replaceChildren();groupB.replaceChildren()}}if(visible)updateLabelCards(data)}
async function update(){try{const response=await fetch('/api/ticker/state',{cache:'no-store'});if(response.ok)render(await response.json())}catch{bar.style.display='none'}}
update();setInterval(update,4000);
window.addEventListener('resize',()=>{if(lastData)fillLoop()});
setInterval(()=>{if(labelCards[labelCardIndex]?.type==='clock')labelText.textContent=tickerBrasiliaTime()},1000);
</script>
</body>
</html>
